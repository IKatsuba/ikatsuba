<svg width="480" height="3639" viewBox="0 0 480 3639" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
  <rect x="0.5" y="0.5" width="479" height="3638" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
  <circle cx="18" cy="21" r="4.5" fill="#f5f5f5"/>
  <circle cx="34" cy="21" r="4.5" fill="#f5f5f5"/>
  <circle cx="50" cy="21" r="4.5" fill="#f5f5f5"/>
  <text x="72" y="25.5" font-size="13" fill="#737373">katsuba.dev</text>
  <text x="462" y="25.5" font-size="13" fill="#a1a1a1" text-anchor="end">:8080</text>
  <line x1="1" y1="41" x2="479" y2="41" stroke="#e5e5e5"/>
  <text x="24" y="78" font-size="14" fill="#a1a1a1" xml:space="preserve">$ <tspan fill="#0a0a0a">./katsuba --serve</tspan></text>
  <rect x="194" y="65" width="8" height="16" fill="#0a0a0a"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <text x="24" y="118" font-size="18" fill="#0a0a0a" font-weight="600">Igor Katsuba — a system exposed</text>
  <text x="24" y="146" font-size="18" fill="#0a0a0a" font-weight="600">over a few transports.</text>
  <text x="24" y="184" font-size="13" fill="#a1a1a1">capabilities:</text>
  <text x="38" y="206" font-size="13" fill="#0a0a0a">[ building, leading, writing, speaking ]</text>
  <text x="24" y="232" font-size="13" fill="#a1a1a1" xml:space="preserve">transports:    <tspan fill="#0a0a0a">[ github · telegram · email ]</tspan></text>
  <text x="24" y="258" font-size="13" fill="#a1a1a1" xml:space="preserve">status:        <tspan fill="#0a0a0a">200 OK — up and serving traffic</tspan></text>
  <line x1="1" y1="298" x2="479" y2="298" stroke="#e5e5e5"/>
  <text x="24" y="332" font-size="13" fill="#a1a1a1">// manifest</text>
  <text x="24" y="364" font-size="16" fill="#0a0a0a" font-weight="600">I build software whose users are</text>
  <text x="24" y="390" font-size="16" fill="#0a0a0a" font-weight="600">increasingly not people. Agents call</text>
  <text x="24" y="416" font-size="16" fill="#0a0a0a" font-weight="600">it, other systems depend on it, and it</text>
  <text x="24" y="442" font-size="16" fill="#0a0a0a" font-weight="600">has to keep working when nobody's</text>
  <text x="24" y="468" font-size="16" fill="#0a0a0a" font-weight="600">watching.</text>
  <line x1="1" y1="506" x2="479" y2="506" stroke="#e5e5e5"/>
  <rect x="24" y="516" width="40" height="24" rx="6" fill="#f5f5f5"/>
  <text x="44.0" y="532" font-size="12" fill="#0a0a0a" font-weight="600" text-anchor="middle">GET</text>
  <text x="76" y="532.5" font-size="14" fill="#0a0a0a" font-weight="600">/about</text>
  <text x="456" y="532" font-size="12" fill="#737373" text-anchor="end">200 OK</text>
  <text x="24" y="572" font-size="13" fill="#737373">I'm a platform engineer working out of Valencia.</text>
  <text x="24" y="593" font-size="13" fill="#737373">For the last while I've been living at the seam</text>
  <text x="24" y="614" font-size="13" fill="#737373">between AI agents and backend infrastructure —</text>
  <text x="24" y="635" font-size="13" fill="#737373">the unglamorous layer that decides whether the</text>
  <text x="24" y="656" font-size="13" fill="#737373">clever stuff on top actually holds.</text>
  <text x="24" y="689" font-size="13" fill="#737373">The framing on this page isn't a gimmick. It's</text>
  <text x="24" y="710" font-size="13" fill="#737373">genuinely how I think about building: define a</text>
  <text x="24" y="731" font-size="13" fill="#737373">capability once, expose it through whatever</text>
  <text x="24" y="752" font-size="13" fill="#737373">transport the caller speaks — HTTP, MCP, a CLI.</text>
  <text x="24" y="773" font-size="13" fill="#737373">Same idea applies to a person. This is me,</text>
  <text x="24" y="794" font-size="13" fill="#737373">exposed over the transports below.</text>
  <text x="24" y="827" font-size="13" fill="#737373">Nearly everything I've built has been for other</text>
  <text x="24" y="848" font-size="13" fill="#737373">engineers rather than for end users: platform</text>
  <text x="24" y="869" font-size="13" fill="#737373">foundations, release paths, test corpora, the</text>
  <text x="24" y="890" font-size="13" fill="#737373">internal tools nobody demos. That comes with the</text>
  <text x="24" y="911" font-size="13" fill="#737373">other half of the job — hiring for the team,</text>
  <text x="24" y="932" font-size="13" fill="#737373">reviewing its code, and starting the weekly</text>
  <text x="24" y="953" font-size="13" fill="#737373">meeting where designs get argued out loud.</text>
  <line x1="24" y1="990" x2="456" y2="990" stroke="#e5e5e5"/>
  <text x="24" y="1020" font-size="14" fill="#0a0a0a" font-weight="600">fn building()</text>
  <text x="24" y="1044" font-size="13" fill="#737373">Durable execution, agent orchestration, developer</text>
  <text x="24" y="1065" font-size="13" fill="#737373">tooling, the glue between systems. I'm happiest</text>
  <text x="24" y="1086" font-size="13" fill="#737373">one layer below the product, where reliability is</text>
  <text x="24" y="1107" font-size="13" fill="#737373">the whole job.</text>
  <text x="24" y="1142" font-size="14" fill="#0a0a0a" font-weight="600">fn leading()</text>
  <text x="24" y="1166" font-size="13" fill="#737373">Platform teams, hiring tracks, and the weekly</text>
  <text x="24" y="1187" font-size="13" fill="#737373">meeting where designs get argued in public</text>
  <text x="24" y="1208" font-size="13" fill="#737373">instead of in DMs. Building for other engineers</text>
  <text x="24" y="1229" font-size="13" fill="#737373">is most of what I do, and the people half comes</text>
  <text x="24" y="1250" font-size="13" fill="#737373">with it.</text>
  <text x="24" y="1285" font-size="14" fill="#0a0a0a" font-weight="600">fn writing()</text>
  <text x="24" y="1309" font-size="13" fill="#737373">I run a Telegram channel on Angular and frontend,</text>
  <text x="24" y="1330" font-size="13" fill="#737373">and a blog with 20+ articles. Explaining things</text>
  <text x="24" y="1351" font-size="13" fill="#737373">is how I understand them, and it turns out other</text>
  <text x="24" y="1372" font-size="13" fill="#737373">people find it useful too.</text>
  <text x="24" y="1407" font-size="14" fill="#0a0a0a" font-weight="600">fn speaking()</text>
  <text x="24" y="1431" font-size="13" fill="#737373">Conference talks on monorepos, build tooling, and</text>
  <text x="24" y="1452" font-size="13" fill="#737373">pipeline acceleration — Frontend Conf, CodeFest,</text>
  <text x="24" y="1473" font-size="13" fill="#737373">Podlodka. The recordings age; the problems they</text>
  <text x="24" y="1494" font-size="13" fill="#737373">solve mostly don't.</text>
  <line x1="1" y1="1533" x2="479" y2="1533" stroke="#e5e5e5"/>
  <rect x="24" y="1543" width="40" height="24" rx="6" fill="#f5f5f5"/>
  <text x="44.0" y="1559" font-size="12" fill="#0a0a0a" font-weight="600" text-anchor="middle">GET</text>
  <text x="76" y="1559.5" font-size="14" fill="#0a0a0a" font-weight="600">/tools</text>
  <text x="456" y="1559" font-size="12" fill="#737373" text-anchor="end">200 OK · 7</text>
  <text x="24" y="1599" font-size="13" fill="#a1a1a1">01</text>
  <text x="64" y="1599" font-size="15" fill="#0a0a0a" font-weight="600">NGGUIDE</text>
  <text x="24" y="1623" font-size="13" fill="#737373">An Angular course an agent takes itself.</text>
  <text x="24" y="1644" font-size="13" fill="#737373">Delivered over MCP, built for the world where the</text>
  <text x="24" y="1665" font-size="13" fill="#737373">student isn't always human.</text>
  <text x="24" y="1702" font-size="13" fill="#a1a1a1">02</text>
  <text x="64" y="1702" font-size="15" fill="#0a0a0a" font-weight="600">roost</text>
  <text x="24" y="1726" font-size="13" fill="#737373">A native macOS workspace for Claude Code sessions</text>
  <text x="24" y="1747" font-size="13" fill="#737373">— projects, tabs, a tree of terminal panes, and</text>
  <text x="24" y="1768" font-size="13" fill="#737373">an attention queue that tells you which agent is</text>
  <text x="24" y="1789" font-size="13" fill="#737373">stuck.</text>
  <text x="24" y="1826" font-size="13" fill="#a1a1a1">03</text>
  <text x="64" y="1826" font-size="15" fill="#0a0a0a" font-weight="600">nx-cache-server</text>
  <text x="24" y="1850" font-size="13" fill="#737373">Self-hosted remote cache for Nx. S3, Docker, Helm</text>
  <text x="24" y="1871" font-size="13" fill="#737373">— bring your own infra, keep your build times.</text>
  <text x="24" y="1908" font-size="13" fill="#a1a1a1">04</text>
  <text x="64" y="1908" font-size="15" fill="#0a0a0a" font-weight="600">mutates</text>
  <text x="24" y="1932" font-size="13" fill="#737373">AST mutation toolkit — mutate the AST, not your</text>
  <text x="24" y="1953" font-size="13" fill="#737373">brain. Hands for an agent that needs to rewrite</text>
  <text x="24" y="1974" font-size="13" fill="#737373">code and be sure it did.</text>
  <text x="24" y="2011" font-size="13" fill="#a1a1a1">05</text>
  <text x="64" y="2011" font-size="15" fill="#0a0a0a" font-weight="600">ng-http</text>
  <text x="24" y="2035" font-size="13" fill="#737373">Experimental declarative HTTP server written with</text>
  <text x="24" y="2056" font-size="13" fill="#737373">Angular. What if your backend spoke the framework</text>
  <text x="24" y="2077" font-size="13" fill="#737373">your frontend already does?</text>
  <text x="24" y="2114" font-size="13" fill="#a1a1a1">06</text>
  <text x="64" y="2114" font-size="15" fill="#0a0a0a" font-weight="600">deno-mastra</text>
  <text x="24" y="2138" font-size="13" fill="#737373">AI agents built with Deno and the Mastra</text>
  <text x="24" y="2159" font-size="13" fill="#737373">framework — the runtime and the orchestration,</text>
  <text x="24" y="2180" font-size="13" fill="#737373">end to end.</text>
  <text x="24" y="2217" font-size="13" fill="#a1a1a1">07</text>
  <text x="64" y="2217" font-size="15" fill="#0a0a0a" font-weight="600">serverless-redis</text>
  <text x="24" y="2241" font-size="13" fill="#737373">HTTP → Redis server, Upstash-compatible. Hono +</text>
  <text x="24" y="2262" font-size="13" fill="#737373">Deno, one click to deploy on Railway.</text>
  <line x1="1" y1="2301" x2="479" y2="2301" stroke="#e5e5e5"/>
  <rect x="24" y="2311" width="40" height="24" rx="6" fill="#f5f5f5"/>
  <text x="44.0" y="2327" font-size="12" fill="#0a0a0a" font-weight="600" text-anchor="middle">GET</text>
  <text x="76" y="2327.5" font-size="14" fill="#0a0a0a" font-weight="600">/speaking</text>
  <text x="456" y="2327" font-size="12" fill="#737373" text-anchor="end">200 OK · 3</text>
  <polygon points="24,2356 24,2368 35,2362" fill="#a1a1a1"/>
  <text x="50" y="2367" font-size="14" fill="#0a0a0a" font-weight="600">Repository evolution: from simple to</text>
  <text x="50" y="2389" font-size="14" fill="#0a0a0a" font-weight="600">complex</text>
  <text x="50" y="2411" font-size="13" fill="#737373">Frontend Conf 2021</text>
  <polygon points="24,2434 24,2446 35,2440" fill="#a1a1a1"/>
  <text x="50" y="2445" font-size="14" fill="#0a0a0a" font-weight="600">Extreme Pipeline Acceleration</text>
  <text x="50" y="2467" font-size="13" fill="#737373">CodeFest Russia 2022</text>
  <polygon points="24,2490 24,2502 35,2496" fill="#a1a1a1"/>
  <text x="50" y="2501" font-size="14" fill="#0a0a0a" font-weight="600">It's all about Nx</text>
  <text x="50" y="2523" font-size="13" fill="#737373">Podlodka 2022</text>
  <line x1="1" y1="2561" x2="479" y2="2561" stroke="#e5e5e5"/>
  <rect x="24" y="2571" width="40" height="24" rx="6" fill="#f5f5f5"/>
  <text x="44.0" y="2587" font-size="12" fill="#0a0a0a" font-weight="600" text-anchor="middle">GET</text>
  <text x="76" y="2587.5" font-size="14" fill="#0a0a0a" font-weight="600">/experience</text>
  <text x="456" y="2587" font-size="12" fill="#737373" text-anchor="end">200 OK · 5</text>
  <text x="24" y="2627" font-size="14" fill="#0a0a0a" font-weight="600">ManifestLabs</text>
  <text x="456" y="2627" font-size="13" fill="#a1a1a1" text-anchor="end">2025 —</text>
  <text x="24" y="2649" font-size="13" fill="#737373">Platform Team</text>
  <text x="24" y="2671" font-size="13" fill="#737373">Legal-tech SaaS. The platform, the release path,</text>
  <text x="24" y="2692" font-size="13" fill="#737373">the incident root cause, and the company's</text>
  <text x="24" y="2713" font-size="13" fill="#737373">internal AI agent platform.</text>
  <line x1="24" y1="2742" x2="456" y2="2742" stroke="#e5e5e5"/>
  <text x="24" y="2764" font-size="14" fill="#0a0a0a" font-weight="600">Plata Card</text>
  <text x="456" y="2764" font-size="13" fill="#a1a1a1" text-anchor="end">2022–2025</text>
  <text x="24" y="2786" font-size="13" fill="#737373">Principal Engineer · Frontend Platform Lead</text>
  <text x="24" y="2808" font-size="13" fill="#737373">Consumer fintech. Led the frontend platform team</text>
  <text x="24" y="2829" font-size="13" fill="#737373">and built the foundation every frontend product</text>
  <text x="24" y="2850" font-size="13" fill="#737373">shipped on, from the internal CRM to the public</text>
  <text x="24" y="2871" font-size="13" fill="#737373">site.</text>
  <line x1="24" y1="2900" x2="456" y2="2900" stroke="#e5e5e5"/>
  <text x="24" y="2922" font-size="14" fill="#0a0a0a" font-weight="600">Tinkoff</text>
  <text x="456" y="2922" font-size="13" fill="#a1a1a1" text-anchor="end">2020–2022</text>
  <text x="24" y="2944" font-size="13" fill="#737373">Staff Engineer · Frontend Platform</text>
  <text x="24" y="2966" font-size="13" fill="#737373">Built the company's frontend platform. Parts were</text>
  <text x="24" y="2987" font-size="13" fill="#737373">released as open source, which is the visible</text>
  <text x="24" y="3008" font-size="13" fill="#737373">tenth of it.</text>
  <line x1="24" y1="3037" x2="456" y2="3037" stroke="#e5e5e5"/>
  <text x="24" y="3059" font-size="14" fill="#0a0a0a" font-weight="600">Fix Group</text>
  <text x="456" y="3059" font-size="13" fill="#a1a1a1" text-anchor="end">2018–2020</text>
  <text x="24" y="3081" font-size="13" fill="#737373">Senior Frontend Developer</text>
  <text x="24" y="3103" font-size="13" fill="#737373">Product frontend, and the first tooling I owned</text>
  <text x="24" y="3124" font-size="13" fill="#737373">rather than used.</text>
  <line x1="24" y1="3153" x2="456" y2="3153" stroke="#e5e5e5"/>
  <text x="24" y="3175" font-size="14" fill="#0a0a0a" font-weight="600">RTLabs</text>
  <text x="456" y="3175" font-size="13" fill="#a1a1a1" text-anchor="end">2014–2018</text>
  <text x="24" y="3197" font-size="13" fill="#737373">Frontend Developer</text>
  <text x="24" y="3219" font-size="13" fill="#737373">Where I started — large government-scale web</text>
  <text x="24" y="3240" font-size="13" fill="#737373">applications.</text>
  <text x="24" y="3275" font-size="13" fill="#a1a1a1" xml:space="preserve">→ <tspan fill="#0a0a0a" font-weight="600">GET /resume</tspan>  <tspan fill="#737373">katsuba.dev/resume.md</tspan></text>
  <line x1="1" y1="3291" x2="479" y2="3291" stroke="#e5e5e5"/>
  <rect x="24" y="3301" width="48" height="24" rx="6" fill="#f5f5f5"/>
  <text x="48.0" y="3317" font-size="12" fill="#0a0a0a" font-weight="600" text-anchor="middle">POST</text>
  <text x="84" y="3317.5" font-size="14" fill="#0a0a0a" font-weight="600">/contact</text>
  <text x="456" y="3317" font-size="12" fill="#737373" text-anchor="end">accepting</text>
  <text x="24" y="3357" font-size="13" fill="#737373">This server accepts connections. If you want to</text>
  <text x="24" y="3378" font-size="13" fill="#737373">talk infrastructure, agents, or the tooling</text>
  <text x="24" y="3399" font-size="13" fill="#737373">underneath both — or just argue about durable</text>
  <text x="24" y="3420" font-size="13" fill="#737373">execution — open a connection.</text>
  <text x="24" y="3457" font-size="13" fill="#a1a1a1" xml:space="preserve">→ <tspan fill="#0a0a0a" font-weight="600">github     </tspan><tspan fill="#737373">github.com/IKatsuba</tspan></text>
  <text x="24" y="3481" font-size="13" fill="#a1a1a1" xml:space="preserve">→ <tspan fill="#0a0a0a" font-weight="600">x          </tspan><tspan fill="#737373">x.com/katsuba_igor</tspan></text>
  <text x="24" y="3505" font-size="13" fill="#a1a1a1" xml:space="preserve">→ <tspan fill="#0a0a0a" font-weight="600">instagram  </tspan><tspan fill="#737373">instagram.com/igor.katsuba</tspan></text>
  <text x="24" y="3529" font-size="13" fill="#a1a1a1" xml:space="preserve">→ <tspan fill="#0a0a0a" font-weight="600">telegram   </tspan><tspan fill="#737373">t.me/Katsuba</tspan></text>
  <text x="24" y="3553" font-size="13" fill="#a1a1a1" xml:space="preserve">→ <tspan fill="#0a0a0a" font-weight="600">email      </tspan><tspan fill="#737373">igor@katsuba.dev</tspan></text>
  <line x1="1" y1="3591" x2="479" y2="3591" stroke="#e5e5e5"/>
  <text x="240.0" y="3617" font-size="12" fill="#a1a1a1" text-anchor="middle"><tspan fill="#737373">katsuba.dev</tspan> · connection closed · <tspan fill="#737373">200</tspan></text>
</svg>
