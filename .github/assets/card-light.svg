<svg width="840" height="2269" viewBox="0 0 840 2269" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
  <rect x="0.5" y="0.5" width="839" height="2268" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
  <circle cx="26" cy="21" r="4.5" fill="#f5f5f5"/>
  <circle cx="42" cy="21" r="4.5" fill="#f5f5f5"/>
  <circle cx="58" cy="21" r="4.5" fill="#f5f5f5"/>
  <text x="80" y="25.5" font-size="13" fill="#737373">katsuba.dev</text>
  <text x="814" y="25.5" font-size="13" fill="#a1a1a1" text-anchor="end">:8080</text>
  <line x1="1" y1="41" x2="839" y2="41" stroke="#e5e5e5"/>
  <text x="32" y="78" font-size="14" fill="#a1a1a1" xml:space="preserve">$ <tspan fill="#0a0a0a">./katsuba --serve</tspan></text>
  <rect x="202" y="65" width="8" height="16" fill="#0a0a0a"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <text x="32" y="118" font-size="19" fill="#0a0a0a" font-weight="600">Igor Katsuba — a system exposed over a few transports.</text>
  <text x="32" y="156" font-size="14" fill="#a1a1a1" xml:space="preserve">capabilities:  <tspan fill="#0a0a0a">[ building, writing, speaking ]</tspan></text>
  <text x="32" y="182" font-size="14" fill="#a1a1a1" xml:space="preserve">transports:    <tspan fill="#0a0a0a">[ github · telegram · email ]</tspan></text>
  <text x="32" y="208" font-size="14" fill="#a1a1a1" xml:space="preserve">status:        <tspan fill="#0a0a0a">200 OK — up and serving traffic</tspan></text>
  <line x1="1" y1="248" x2="839" y2="248" stroke="#e5e5e5"/>
  <text x="32" y="282" font-size="13" fill="#a1a1a1">// manifest</text>
  <text x="32" y="314" font-size="17" fill="#0a0a0a" font-weight="600">I build software whose users are increasingly not people. Agents</text>
  <text x="32" y="342" font-size="17" fill="#0a0a0a" font-weight="600">call it, other systems depend on it, and it has to keep working</text>
  <text x="32" y="370" font-size="17" fill="#0a0a0a" font-weight="600">when nobody's watching.</text>
  <line x1="1" y1="410" x2="839" y2="410" stroke="#e5e5e5"/>
  <rect x="32" y="420" width="40" height="24" rx="6" fill="#f5f5f5"/>
  <text x="52.0" y="436" font-size="12" fill="#0a0a0a" font-weight="600" text-anchor="middle">GET</text>
  <text x="84" y="436.5" font-size="14" fill="#0a0a0a" font-weight="600">/about</text>
  <text x="808" y="436" font-size="12" fill="#737373" text-anchor="end">200 OK · text/plain</text>
  <text x="32" y="476" font-size="13" fill="#737373">I'm a senior engineer working out of Valencia. For the last while I've been living at the</text>
  <text x="32" y="497" font-size="13" fill="#737373">seam between AI agents and backend infrastructure — the unglamorous layer that decides</text>
  <text x="32" y="518" font-size="13" fill="#737373">whether the clever stuff on top actually holds.</text>
  <text x="32" y="551" font-size="13" fill="#737373">The framing on this page isn't a gimmick. It's genuinely how I think about building:</text>
  <text x="32" y="572" font-size="13" fill="#737373">define a capability once, expose it through whatever transport the caller speaks — HTTP,</text>
  <text x="32" y="593" font-size="13" fill="#737373">MCP, a CLI. Same idea applies to a person. This is me, exposed over the transports below.</text>
  <line x1="32" y1="630" x2="808" y2="630" stroke="#e5e5e5"/>
  <text x="32" y="660" font-size="14" fill="#0a0a0a" font-weight="600">fn building()</text>
  <text x="32" y="684" font-size="13" fill="#737373">Durable execution, agent orchestration, developer tooling, the glue between systems. I'm</text>
  <text x="32" y="705" font-size="13" fill="#737373">happiest one layer below the product, where reliability is the whole job.</text>
  <text x="32" y="740" font-size="14" fill="#0a0a0a" font-weight="600">fn writing()</text>
  <text x="32" y="764" font-size="13" fill="#737373">I run a Telegram channel on Angular and frontend, and a blog with 20+ articles.</text>
  <text x="32" y="785" font-size="13" fill="#737373">Explaining things is how I understand them, and it turns out other people find it useful</text>
  <text x="32" y="806" font-size="13" fill="#737373">too.</text>
  <text x="32" y="841" font-size="14" fill="#0a0a0a" font-weight="600">fn speaking()</text>
  <text x="32" y="865" font-size="13" fill="#737373">Conference talks on monorepos, build tooling, and pipeline acceleration — Frontend Conf,</text>
  <text x="32" y="886" font-size="13" fill="#737373">CodeFest, Podlodka. The recordings age; the problems they solve mostly don't.</text>
  <line x1="1" y1="925" x2="839" y2="925" stroke="#e5e5e5"/>
  <rect x="32" y="935" width="40" height="24" rx="6" fill="#f5f5f5"/>
  <text x="52.0" y="951" font-size="12" fill="#0a0a0a" font-weight="600" text-anchor="middle">GET</text>
  <text x="84" y="951.5" font-size="14" fill="#0a0a0a" font-weight="600">/tools</text>
  <text x="808" y="951" font-size="12" fill="#737373" text-anchor="end">200 OK · 7 items · application/json</text>
  <text x="32" y="991" font-size="13" fill="#a1a1a1">01</text>
  <text x="72" y="991" font-size="15" fill="#0a0a0a" font-weight="600">ng.guide</text>
  <text x="72" y="1015" font-size="13" fill="#737373">An Angular course an agent takes itself. Delivered over MCP, built for the world</text>
  <text x="72" y="1036" font-size="13" fill="#737373">where the student isn't always human.</text>
  <text x="32" y="1073" font-size="13" fill="#a1a1a1">02</text>
  <text x="72" y="1073" font-size="15" fill="#0a0a0a" font-weight="600">roost</text>
  <text x="72" y="1097" font-size="13" fill="#737373">A native macOS workspace for Claude Code sessions — projects, tabs, a tree of</text>
  <text x="72" y="1118" font-size="13" fill="#737373">terminal panes, and an attention queue that tells you which agent is stuck.</text>
  <text x="32" y="1155" font-size="13" fill="#a1a1a1">03</text>
  <text x="72" y="1155" font-size="15" fill="#0a0a0a" font-weight="600">nx-cache-server</text>
  <text x="72" y="1179" font-size="13" fill="#737373">Self-hosted remote cache for Nx. S3, Docker, Helm — bring your own infra, keep your</text>
  <text x="72" y="1200" font-size="13" fill="#737373">build times.</text>
  <text x="32" y="1237" font-size="13" fill="#a1a1a1">04</text>
  <text x="72" y="1237" font-size="15" fill="#0a0a0a" font-weight="600">mutates</text>
  <text x="72" y="1261" font-size="13" fill="#737373">AST mutation toolkit — mutate the AST, not your brain. Hands for an agent that needs</text>
  <text x="72" y="1282" font-size="13" fill="#737373">to rewrite code and be sure it did.</text>
  <text x="32" y="1319" font-size="13" fill="#a1a1a1">05</text>
  <text x="72" y="1319" font-size="15" fill="#0a0a0a" font-weight="600">ng-http</text>
  <text x="72" y="1343" font-size="13" fill="#737373">Experimental declarative HTTP server written with Angular. What if your backend</text>
  <text x="72" y="1364" font-size="13" fill="#737373">spoke the framework your frontend already does?</text>
  <text x="32" y="1401" font-size="13" fill="#a1a1a1">06</text>
  <text x="72" y="1401" font-size="15" fill="#0a0a0a" font-weight="600">deno-mastra</text>
  <text x="72" y="1425" font-size="13" fill="#737373">AI agents built with Deno and the Mastra framework — the runtime and the</text>
  <text x="72" y="1446" font-size="13" fill="#737373">orchestration, end to end.</text>
  <text x="32" y="1483" font-size="13" fill="#a1a1a1">07</text>
  <text x="72" y="1483" font-size="15" fill="#0a0a0a" font-weight="600">serverless-redis</text>
  <text x="72" y="1507" font-size="13" fill="#737373">HTTP → Redis server, Upstash-compatible. Hono + Deno, one click to deploy on</text>
  <text x="72" y="1528" font-size="13" fill="#737373">Railway.</text>
  <line x1="1" y1="1567" x2="839" y2="1567" stroke="#e5e5e5"/>
  <rect x="32" y="1577" width="40" height="24" rx="6" fill="#f5f5f5"/>
  <text x="52.0" y="1593" font-size="12" fill="#0a0a0a" font-weight="600" text-anchor="middle">GET</text>
  <text x="84" y="1593.5" font-size="14" fill="#0a0a0a" font-weight="600">/speaking</text>
  <text x="808" y="1593" font-size="12" fill="#737373" text-anchor="end">200 OK · 3 talks · video</text>
  <polygon points="32,1622 32,1634 43,1628" fill="#a1a1a1"/>
  <text x="58" y="1633" font-size="14" fill="#0a0a0a" font-weight="600">Repository evolution: from simple to complex</text>
  <text x="808" y="1633" font-size="13" fill="#737373" text-anchor="end">Frontend Conf 2021</text>
  <polygon points="32,1656 32,1668 43,1662" fill="#a1a1a1"/>
  <text x="58" y="1667" font-size="14" fill="#0a0a0a" font-weight="600">Extreme Pipeline Acceleration</text>
  <text x="808" y="1667" font-size="13" fill="#737373" text-anchor="end">CodeFest Russia 2022</text>
  <polygon points="32,1690 32,1702 43,1696" fill="#a1a1a1"/>
  <text x="58" y="1701" font-size="14" fill="#0a0a0a" font-weight="600">It's all about Nx</text>
  <text x="808" y="1701" font-size="13" fill="#737373" text-anchor="end">Podlodka 2022</text>
  <line x1="1" y1="1739" x2="839" y2="1739" stroke="#e5e5e5"/>
  <rect x="32" y="1749" width="40" height="24" rx="6" fill="#f5f5f5"/>
  <text x="52.0" y="1765" font-size="12" fill="#0a0a0a" font-weight="600" text-anchor="middle">GET</text>
  <text x="84" y="1765.5" font-size="14" fill="#0a0a0a" font-weight="600">/experience</text>
  <text x="808" y="1765" font-size="12" fill="#737373" text-anchor="end">200 OK · 4 roles · résumé</text>
  <text x="32" y="1805" font-size="14" fill="#0a0a0a" font-weight="600">Plata Card</text>
  <text x="380" y="1805" font-size="13" fill="#737373">Principal Engineer</text>
  <text x="808" y="1805" font-size="13" fill="#a1a1a1" text-anchor="end">2022–2025</text>
  <line x1="32" y1="1823" x2="808" y2="1823" stroke="#e5e5e5"/>
  <text x="32" y="1845" font-size="14" fill="#0a0a0a" font-weight="600">Tinkoff</text>
  <text x="380" y="1845" font-size="13" fill="#737373">Staff Engineer</text>
  <text x="808" y="1845" font-size="13" fill="#a1a1a1" text-anchor="end">2020–2022</text>
  <line x1="32" y1="1863" x2="808" y2="1863" stroke="#e5e5e5"/>
  <text x="32" y="1885" font-size="14" fill="#0a0a0a" font-weight="600">Fix Group</text>
  <text x="380" y="1885" font-size="13" fill="#737373">Senior Frontend Developer</text>
  <text x="808" y="1885" font-size="13" fill="#a1a1a1" text-anchor="end">2018–2020</text>
  <line x1="32" y1="1903" x2="808" y2="1903" stroke="#e5e5e5"/>
  <text x="32" y="1925" font-size="14" fill="#0a0a0a" font-weight="600">RTLabs</text>
  <text x="380" y="1925" font-size="13" fill="#737373">Frontend Developer</text>
  <text x="808" y="1925" font-size="13" fill="#a1a1a1" text-anchor="end">2014–2018</text>
  <line x1="1" y1="1963" x2="839" y2="1963" stroke="#e5e5e5"/>
  <rect x="32" y="1973" width="48" height="24" rx="6" fill="#f5f5f5"/>
  <text x="56.0" y="1989" font-size="12" fill="#0a0a0a" font-weight="600" text-anchor="middle">POST</text>
  <text x="92" y="1989.5" font-size="14" fill="#0a0a0a" font-weight="600">/contact</text>
  <text x="808" y="1989" font-size="12" fill="#737373" text-anchor="end">accepting connections</text>
  <text x="32" y="2029" font-size="13" fill="#737373">This server accepts connections. If you want to talk infrastructure, agents, or the</text>
  <text x="32" y="2050" font-size="13" fill="#737373">tooling underneath both — or just argue about durable execution — open a connection.</text>
  <text x="32" y="2087" font-size="13" fill="#a1a1a1" xml:space="preserve">→ <tspan fill="#0a0a0a" font-weight="600">github     </tspan><tspan fill="#737373">github.com/IKatsuba</tspan></text>
  <text x="32" y="2111" font-size="13" fill="#a1a1a1" xml:space="preserve">→ <tspan fill="#0a0a0a" font-weight="600">x          </tspan><tspan fill="#737373">x.com/katsuba_igor</tspan></text>
  <text x="32" y="2135" font-size="13" fill="#a1a1a1" xml:space="preserve">→ <tspan fill="#0a0a0a" font-weight="600">instagram  </tspan><tspan fill="#737373">instagram.com/igor.katsuba</tspan></text>
  <text x="32" y="2159" font-size="13" fill="#a1a1a1" xml:space="preserve">→ <tspan fill="#0a0a0a" font-weight="600">telegram   </tspan><tspan fill="#737373">t.me/Katsuba</tspan></text>
  <text x="32" y="2183" font-size="13" fill="#a1a1a1" xml:space="preserve">→ <tspan fill="#0a0a0a" font-weight="600">email      </tspan><tspan fill="#737373">igor@katsuba.dev</tspan></text>
  <line x1="1" y1="2221" x2="839" y2="2221" stroke="#e5e5e5"/>
  <text x="420.0" y="2247" font-size="12" fill="#a1a1a1" text-anchor="middle"><tspan fill="#737373">katsuba.dev</tspan> · connection closed · <tspan fill="#737373">200</tspan></text>
